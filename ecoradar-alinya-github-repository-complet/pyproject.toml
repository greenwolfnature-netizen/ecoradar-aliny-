[project]
name = "ecoradar"
version = "0.1.0"
description = "Base engine architecture for EcoRadar study-area preparation."
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14",
  "shapely>=2",
  "pyproj>=3",
  "pyogrio>=0.7",
  "rasterio>=1.4",
  "laspy>=2.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
ecoradar = "ecoradar.cli:main"
ecoradar-pipeline = "ecoradar.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ecoradar", "ecoradar.*"]
exclude = [
  "config*",
  "docs*",
  "history*",
  "metadata*",
  "netlify*",
  "projectes*",
  "tests*",
  "tools*",
  "vendor*",
]
namespaces = false
