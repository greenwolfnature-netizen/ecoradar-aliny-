          "feeds_indicators": ["CORE_01", "CORE_08", "CORE_12"],
          "required": false,
          "on_failure": "USE_EXISTING_PRODUCT_MAP_CONTEXT_AND_MARK_PARTIAL",
          "error_message": "La cartografia base ICGC encara no està integrada com a connector automàtic.",
          "confidence_if_missing": "mitjana",
          "expected_outputs": ["maps/producte/mapa_base_alinya.png", "maps/producte/mapa_espai_alinya.png"]
