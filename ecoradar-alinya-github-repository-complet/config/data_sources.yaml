{
  "version": "1.0",
  "policy": {
    "required_before_core": [
      "data_availability_report",
      "connectors_status_report",
      "indicators_completeness_report"
    ],
    "missing_data_rule": "Never replace missing key data with invented estimates. Mark affected indicators as NO DISPONIBLE or PARCIAL and lower confidence.",
    "connector_scope_rule": "Connectors only connect, download, normalize and return data. Analysis and diagnosis run after this availability gate."
  },
  "blocks": [
    {
      "id": "study_area",
      "name": "Àrea d'estudi",
      "sources": [
        {
          "id": "study_area_file",
          "name": "Límit de l'àrea d'estudi",
          "url": "projectes/{project}/processed/study_area.gpkg",
          "access_type": "fitxer manual",
          "expected_format": "GeoPackage",
          "responsible_connector": "ecoradar.core.study_area",
          "minimum_fields": ["geometry", "crs", "surface_ha", "perimeter_m"],
          "feeds_indicators": ["CORE_01", "CORE_02", "CORE_04", "CORE_05", "CORE_08", "CORE_09", "CORE_10", "CORE_11", "CORE_12"],
          "required": true,
          "on_failure": "BLOCK_CORE",
          "error_message": "No es pot executar EcoRadar sense una àrea d'estudi validada.",
          "confidence_if_missing": "baixa",
          "expected_outputs": ["processed/study_area.gpkg", "metadata/study_area_metadata.json"]
        }
      ]
    },
    {
      "id": "base_cartography",
