  - id: climate_xema_socrata_observations
    domain: climate
    source_name: Dades meteorologiques de la XEMA
    responsible_organization: Servei Meteorologic de Catalunya / Generalitat de Catalunya
    official_url: https://analisi.transparenciacatalunya.cat/d/nzvn-apee
    service_type: Socrata open data API
    data_format:
      - JSON
      - CSV
    crs: station metadata in WGS84 (EPSG:4326); observations are tabular
    available_variables:
      - half-hourly relative humidity
      - half-hourly wind speed
      - wind direction
      - maximum wind gust
      - observation timestamp in UTC
      - validation state
    update_frequency: every 30 minutes
    usage_license: METEOCAT intellectual-property terms and Generalitat open-data attribution
    example_connection: https://analisi.transparenciacatalunya.cat/resource/nzvn-apee.json
    connector_status: verified
    verification_notes: Verified on 2026-07-22 and rechecked on 2026-08-07. Public Socrata access requires no API key. Station Y4 Alinya publishes temperature, humidity and precipitation but no wind variables. Station CJ Organya is the nearest operational XEMA station verified with variable 30, at 9.2 km from Y4, and is used only as explicitly labelled nearby wind context. Variable 33 is relative humidity and variable 30 is wind speed. Unvalidated blank-state observations remain real provisional measurements and must be labelled as such.

  - id: hydrology_che_saih_streamflow_la_seu
    domain: hydrology
    source_name: SAIH Ebro current river-gauging observations
    responsible_organization: Confederacion Hidrografica del Ebro / MITECO
    official_url: https://www.saihebro.com/tiempo-real/estacion-aforos-A022-valira-seu
    service_type: public HTTP current-values endpoint used by official station pages
    data_format:
      - JSON with embedded HTML table
      - normalized CSV
    crs: official latitude and longitude retained in WGS84 (EPSG:4326); station pages also publish zone 30 coordinates
    available_variables:
      - instantaneous discharge in cubic metres per second
      - instantaneous river level in metres
      - precipitation accumulated over 24 hours where published by the station
      - source trend glyph and public recent minigraph samples
      - local observation timestamp
      - station code
      - river name
      - signal tag
    update_frequency: every 15 minutes at source; checked daily, queried on viewer load and polled every 15 minutes while the viewer remains visible, with on-demand direct CORS access and an EcoRadar Netlify Function fallback
    usage_license: exact open-data license not declared on the inspected endpoint; CHE/SAIH attribution required and limitation documented
    example_connection: https://www.saihebro.com/api/ficha/procesarTablaValoresActuales?estacion=A022
    connector_status: verified
    verification_notes: Verified without credentials on 2026-07-26 and reverified on 2026-07-27 for A022 Valira and A023 Segre at la Seu d'Urgell. Both current-value requests returned HTTP 200 and application/json with VALORES_ACTUALES. On 2026-07-27 both exposed an observation at 17:45 CEST - 6.12 m3/s for A022 and 1.07 m3/s for A023. GET responses exposed Access-Control-Allow-Origin * and the OPTIONS preflight returned HTTP 204, so no browser CORS block was observed. A deployed Netlify request returned an upstream timeout even while the same official endpoint responded directly in under one second. The viewer therefore uses direct official CORS access first and the Netlify Function as fallback. It loads both current observations immediately and polls again every 15 minutes while the page remains visible. The function forces IPv4 and races the official www, ap and internet SAIH hosts with a 4.5-second per-host limit. The server also omitted the FNMT AC Componentes Informaticos intermediate certificate, so the function securely adds the official AIA intermediate to Node public roots; TLS verification is never disabled. The proxy validates and normalizes the response and exposes exact errors. The public station endpoint exposes level, discharge and station precipitation signals; A022 24-hour precipitation is A022O83PA24H. Its public minigraph endpoint supplies an undated recent value sequence suitable only for a qualitative short-term trend. Dated historical graphs require a CHE account and are documented as requires_credentials. Real-time values are provisional, unfiltered and subject to review. They are point observations, not flood alerts.

  - id: climate_meteocat_municipal_precipitation_forecast_la_seu
    domain: climate
    source_name: Prediccio municipal de precipitacio de la Seu d'Urgell
    responsible_organization: Servei Meteorologic de Catalunya / Generalitat de Catalunya
    official_url: https://www.meteo.cat/prediccio/municipal/252038
    service_type: public first-party JSON used by the official Meteocat municipal widget
    data_format:
      - JSON
      - normalized CSV
    crs: municipality centroid coordinates in the response; forecast values are municipal, not a street grid
    available_variables:
      - hourly accumulated precipitation forecast
      - forecast valid time
      - model issue time
      - municipality code and name
    update_frequency: operational forecast; endpoint issue time is preserved on every EcoRadar check
    usage_license: no specific reuse licence was identified in the inspected widget endpoint; Meteocat and Generalitat attribution required
    example_connection: https://static-m.meteo.cat/ginys/models/postProcessament/variables/prec_acum/intervals/1/prec_acum-1_1h.json
    connector_status: verified
    verification_notes: Verified without credentials on 2026-07-25 for municipality code 252038. EcoRadar downloads the three public day files and selects only the municipal record. It is a municipal forecast, not a street-scale rainfall field or an official warning.

