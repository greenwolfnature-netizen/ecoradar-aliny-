name: Update EcoRadar Alinyà daily readings

on:
  push:
    branches:
      - main
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-current-fire-danger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
      COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install EcoRadar
        run: |
          pip install -e .
          pip install reportlab pypdf
      - name: Fix one audit timestamp for the complete daily run
        run: echo "ECORADAR_CHECKED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Update XEMA observations for Alinyà
        id: xema_alinya
        continue-on-error: true
        run: python -m ecoradar.connectors.connector_meteocat_xema --location alinya
      - name: Verify XEMA fallback
        if: steps.xema_alinya.outcome == 'failure'
        run: test -s projectes/Alinya/raw/meteocat_xema/Y4_observations.csv
      - name: Update nearest official XEMA wind context
        id: xema_wind
        continue-on-error: true
        run: python tools/fetch_alinya_xema_wind.py
      - name: Verify XEMA wind fallback
        if: steps.xema_wind.outcome == 'failure'
        run: test -s projectes/Alinya/raw/meteocat_xema/CJ_wind_observations.csv
      - name: Update official Pla Alfa level for Fígols i Alinyà
        id: pla_alfa
        continue-on-error: true
        run: python -m ecoradar.connectors.connector_pla_alfa
      - name: Verify Pla Alfa fallback
        if: steps.pla_alfa.outcome == 'failure'
        run: test -s projectes/Alinya/raw/pla_alfa/figols_alinya_current.json
      - name: Update current CAMS air-quality context
        id: cams
        continue-on-error: true
        run: python tools/fetch_alinya_cams_context.py
      - name: Verify CAMS fallback
        if: steps.cams.outcome == 'failure'
        run: test -s projectes/Alinya/indicators/contextual_environment.json
      - name: Check latest CREAF ForestDrought model
        id: forestdrought
        continue-on-error: true
        run: python tools/fetch_alinya_creaf_forestdrought.py
      - name: Verify ForestDrought fallback
        if: steps.forestdrought.outcome == 'failure'
        run: test -s projectes/Alinya/raw/creaf_forestdrought/forestdrought_latest.geojson
      - name: Check latest QA-valid Landsat surface temperature
        id: landsat
        continue-on-error: true
        run: python tools/fetch_alinya_landsat_composite.py
      - name: Recalculate only Landsat-dependent outputs when the source changed
        if: steps.landsat.outcome == 'success'
        run: |
          if ! git diff --quiet -- projectes/Alinya/processed/landsat projectes/Alinya/metadata/landsat_connector.json; then
            echo "A new QA-valid Landsat source is available."
          fi
      - name: Check latest detailed ECOSTRESS surface temperature
        id: ecostress
        continue-on-error: true
        run: python tools/fetch_alinya_ecostress.py
      - name: Select the freshest detailed QA-valid surface temperature
        run: python tools/select_alinya_surface_temperature.py
      - name: Recalculate date-dependent topographic shade
        run: python tools/recalculate_alinya_daily_shade.py
      - name: Recalculate only when the selected detailed temperature changed
        run: |
          if ! git diff --quiet -- projectes/Alinya/metadata/current_surface_temperature.json; then
            python tools/calculate_alinya_satellite_layers.py
            python tools/calculate_alinya_climatic_refuges.py
          fi
      - name: Discover recent official Sentinel-2 candidates
        id: sentinel_catalog
        continue-on-error: true
        run: python tools/fetch_alinya_cdse_sentinel2.py --max-cloud 10 --catalog-only
      - name: Update best recent QA-valid Sentinel-2 scene
        id: sentinel
        if: env.COPERNICUS_CLIENT_ID != '' && env.COPERNICUS_CLIENT_SECRET != ''
        continue-on-error: true
        run: python tools/fetch_alinya_cdse_sentinel2.py --max-cloud 10 --max-candidates 8 --minimum-aoi-coverage-pct 85
      - name: Recalculate Sentinel-2 readings only when the source changed
        if: steps.sentinel.outcome == 'success'
        run: |
          if ! git diff --quiet -- projectes/Alinya/processed/sentinel2_cdse projectes/Alinya/metadata/sentinel2_cdse_automated_connector.json; then
            python tools/calculate_alinya_sentinel2_indicators.py
            python tools/calculate_alinya_climatic_refuges.py
          fi
      - name: Recalculate source-dependent products and initialise the shared snapshot
        run: |
          python tools/calculate_alinya_current_fire_danger.py
          python tools/build_alinya_biodiversity_habitat_pilot.py
          python tools/calculate_alinya_daily_readings.py
          python tools/run_data_availability_check.py --project projectes/Alinya
          python tools/build_alinya_snapshot.py
      - name: Recalculate the Phase 2 RADAR, diagnosis and management synthesis
        run: |
          python tools/run_indicator_engine.py --project projectes/Alinya --allow-partial-copernicus
          python tools/run_diagnosis_engine.py --project projectes/Alinya --allow-partial-copernicus
          python tools/run_recommendation_engine.py --project projectes/Alinya --allow-partial-copernicus
          python tools/update_alinya_daily_history.py
          python tools/build_alinya_snapshot.py
      - name: Rebuild the public viewer from the coherent snapshot
        run: |
          python tools/sync_alinya_netlify.py
          python tools/sync_alinya_repository_root.py --repository-root .
          python tools/export_postfoc_ecoradar_alinya_interactive.py
      - name: Rebuild the Phase 2 PDFs from the same snapshot
        run: |
          python ecoradar/reporting/client_report_a4.py --project projectes/Alinya
          python tools/export_alinya_integrated_report_urban_template.py
      - name: Validate generated outputs
        run: |
          python -m py_compile ecoradar/connectors/connector_meteocat_xema.py ecoradar/connectors/connector_pla_alfa.py ecoradar/connectors/connector_biodiversitat.py ecoradar/connectors/connector_habitats.py ecoradar/connectors/connector_incendis_historial.py ecoradar/indicators/engine.py ecoradar/indicators/alinya_phase2.py ecoradar/diagnosis/engine.py ecoradar/diagnosis/alinya_phase2.py ecoradar/recommendations/engine.py ecoradar/validation/engine.py tools/fetch_la_seu_cdse_sentinel2.py tools/fetch_alinya_xema_wind.py tools/fetch_alinya_cams_context.py tools/fetch_alinya_creaf_forestdrought.py tools/fetch_alinya_landsat_composite.py tools/fetch_alinya_ecostress.py tools/select_alinya_surface_temperature.py tools/recalculate_alinya_daily_shade.py tools/fetch_alinya_cdse_sentinel2.py tools/calculate_alinya_sentinel2_indicators.py tools/calculate_alinya_satellite_layers.py tools/calculate_alinya_climatic_refuges.py tools/calculate_alinya_current_fire_danger.py tools/calculate_alinya_daily_readings.py tools/build_alinya_snapshot.py tools/update_alinya_daily_history.py tools/build_alinya_biodiversity_habitat_pilot.py tools/run_diagnosis_engine.py tools/run_recommendation_engine.py tools/run_validation_engine.py tools/export_ecoradar_alinya_netlify.py tools/sync_alinya_netlify.py tools/sync_alinya_repository_root.py tools/validate_alinya_daily_timestamps.py
          python -m unittest tests.test_alinya_current_fire_context
          python -m unittest tests.test_alinya_phase1_coherence
          python -m unittest tests.test_alinya_phase2_methodology
          python -m unittest tests.test_alinya_phase2_public_artifacts
          python -m unittest tests.test_alinya_interactive_diagnosis_traceability
          python tools/run_validation_engine.py --project projectes/Alinya --allow-partial-copernicus
          python tests/test_alinya_biodiversity_habitat_pilot.py
          python tests/test_alinya_workflow_safety.py
          python tools/validate_alinya_daily_timestamps.py --max-age-minutes 30
          node --check netlify/functions/daily-readings.mjs
          node --test tests/js/test-daily-readings-api.mjs
          test -s index.html
          test -s netlify.toml
          test -s metadata/daily_readings.json
          test -s history/daily_readings_checks.jsonl
          test -s projectes/Alinya/maps/incendis/current_fire_danger_cells.geojson
          test -s projectes/Alinya/maps/incendis/current_fire_danger.webp
          test -s projectes/Alinya/indicators/daily_readings.json
          test -s projectes/Alinya/indicators/daily_history.json
          test -s projectes/Alinya/metadata/reading_registry.json
          test -s projectes/Alinya/raw/pla_alfa/figols_alinya_current.json
          grep -q "Perill d'incendi avui" index.html
          grep -q "Lectura remota actualitzada" index.html
          python tools/build_alinya_public_site.py
          test -s public/index.html
          test -s public/projectes/Alinya/reports/fitxa_ecoradar_alinya_a4.pdf
          test -s public/projectes/Alinya/reports/informe_complet_muntanya_alinya.pdf
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "EcoRadar data updater"
          git config user.email "ecoradar-bot@users.noreply.github.com"
          base_sha=$(git rev-parse HEAD)
          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha=$(git rev-parse "origin/${GITHUB_REF_NAME}")
          if [ "$base_sha" != "$remote_sha" ]; then
            echo "::notice::A newer run already updated ${GITHUB_REF_NAME}; this stale snapshot will not overwrite it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add index.html netlify.toml THIRD_PARTY_NOTICES.md metadata history netlify vendor docs/current-fire-danger-source.md docs/data-sources-matrix.md docs/fire-source.md docs/alinya-daily-readings-source.md projectes/Alinya/raw/meteocat_xema projectes/Alinya/raw/pla_alfa projectes/Alinya/raw/cams projectes/Alinya/raw/creaf_forestdrought projectes/Alinya/processed/landsat projectes/Alinya/processed/incendis/current_fire_danger projectes/Alinya/processed/teledeteccio projectes/Alinya/maps projectes/Alinya/indicators projectes/Alinya/metadata projectes/Alinya/diagnosis projectes/Alinya/recommendations projectes/Alinya/history ':(exclude)projectes/Alinya/maps/*.zip'
          if [ -e projectes/Alinya/processed/ecostress ]; then
            git add projectes/Alinya/processed/ecostress
          fi
          if [ -e projectes/Alinya/processed/sentinel2_cdse ]; then
            git add projectes/Alinya/processed/sentinel2_cdse
          fi
          if [ -e projectes/Alinya/raw/sentinel2_cdse_official ]; then
            git add projectes/Alinya/raw/sentinel2_cdse_official
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update EcoRadar Alinyà daily readings"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            else
              git fetch origin "${GITHUB_REF_NAME}"
              remote_sha=$(git rev-parse "origin/${GITHUB_REF_NAME}")
              if [ "$remote_sha" = "$base_sha" ]; then
                echo "::error::The push failed without a newer remote commit; this is not a safe supersession."
                exit 1
              fi
              echo "::notice::A newer run won the publish race; keeping its data and skipping this stale deployment."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "The timestamp should change on every run; refusing to deploy an uncommitted snapshot." >&2
            exit 1
          fi
      - name: Publish the refreshed interactive fitxa to Netlify
        if: steps.commit.outputs.skip != 'true' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli deploy --prod --dir public --functions netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "EcoRadar ${{ steps.commit.outputs.sha }}"
      - name: Verify the public Netlify deployment
        if: steps.commit.outputs.skip != 'true'
        env:
          ECORADAR_PUBLIC_URL: https://ecoradar-alinya.netlify.app
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS "${ECORADAR_PUBLIC_URL}/?commit=${{ steps.commit.outputs.sha }}" -o "$RUNNER_TEMP/ecoradar-index.html" &&
               curl -fsS "${ECORADAR_PUBLIC_URL}/api/daily-readings?commit=${{ steps.commit.outputs.sha }}" -o "$RUNNER_TEMP/ecoradar-daily-readings.json" &&
               grep -q 'data-mode="fireCurrent"' "$RUNNER_TEMP/ecoradar-index.html" &&
               python -c 'import datetime,json,sys; parse=lambda value: datetime.datetime.fromisoformat(value.replace("Z","+00:00")); data=json.load(open(sys.argv[1])); raise SystemExit(0 if parse(data["checked_at_utc"]) == parse(sys.argv[2]) and data.get("snapshot_id") else 1)' "$RUNNER_TEMP/ecoradar-daily-readings.json" "$ECORADAR_CHECKED_AT_UTC"; then
              echo "Verified current EcoRadar viewer and daily-readings API in production."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Netlify still serves an old viewer or the daily-readings API is unavailable."
          exit 1
